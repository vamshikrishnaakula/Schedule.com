volumes:
  database-data:
  redis-data:

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: database
    image: postgres:15
    restart: always
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: unicorn_user
      POSTGRES_PASSWORD: magical_password
      POSTGRES_DB: calendso
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicorn_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - stack
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  calcom:
    container_name: calcom-web
    image: calcom-calcom-api:latest
    restart: always
    networks:
      - stack
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_DIRECT_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_READ_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_WRITE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      WEB_APP_URL: ${WEB_APP_URL}
      LOG_LEVEL: info
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  studio:
    container_name: calcom-studio
    image: calcom.docker.scarf.sh/calcom/cal.com:latest
    restart: always
    networks:
      - stack
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_DIRECT_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      NODE_ENV: production
    depends_on:
      database:
        condition: service_healthy
    command:
      - npx
      - prisma
      - studio

